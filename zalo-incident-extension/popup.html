<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Cài đặt kết nối Hệ thống</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #0f172a;
      background: #ffffff;
      box-sizing: border-box;
    }
    * {
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .badge-icon {
      width: 24px;
      height: 24px;
      background: #0f172a;
      color: white;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }
    h1 {
      font-size: 13.5px;
      margin: 0;
      font-weight: 700;
      color: #0f172a;
    }
    .field {
      margin-bottom: 11px;
    }
    label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 7px 9px;
      font-size: 12.5px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      color: #0f172a;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #0284c7;
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }
    .hint {
      font-size: 10.5px;
      color: #64748b;
      margin-top: 3px;
      line-height: 1.35;
    }
    .actions {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #1e293b;
    }
    .status-msg {
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11.5px;
      text-align: center;
      display: none;
    }
    .status-msg.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge-icon">⚡</div>
    <h1>Kết nối Trung tâm DVCI</h1>
  </div>

  <div class="field">
    <label for="apiUrl">Địa chỉ API Server:</label>
    <input type="text" id="apiUrl" value="http://localhost:3000/api/v1" placeholder="http://localhost:3000/api/v1" />
    <div class="hint">Đường dẫn gốc API của hệ thống (mặc định: http://localhost:3000/api/v1).</div>
  </div>

  <div class="field">
    <label for="apiKey">Khóa bảo mật (x-api-key):</label>
    <input type="password" id="apiKey" value="" autocomplete="off" />
    <div class="hint">Khóa API xác thực để gửi sự cố vào database.</div>
  </div>

  <div class="actions">
    <button type="button" id="saveBtn">Lưu Cấu Hình</button>
  </div>

  <div id="statusMsg" class="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
